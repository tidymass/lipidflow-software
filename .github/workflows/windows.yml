name: Windows build and parity checks
on:
  push:
    branches: [main, 'windows-sync/**']
    paths: ['src/**', 'shared/**', 'electron/**', 'backend/**', 'scripts/**', 'tests/**', 'packaging/**', 'assets/**', 'package*.json', 'vite.config.ts', 'tsconfig.json', '.github/workflows/windows.yml']
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read shared R version
        id: baseline
        shell: pwsh
        run: |
          $version = (Get-Content packaging/r-packages.lock.json | ConvertFrom-Json).R.Version
          "r_version=$version" >> $env:GITHUB_OUTPUT
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.baseline.outputs.r_version }}
          rtools-version: '45'
          use-public-rspm: false
      - name: Verify release version
        if: github.event_name == 'release'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version" -and $env:RELEASE_TAG -ne $version) { throw 'Tag must match package.json version' }
      - name: Fetch pinned upstream test data
        uses: actions/checkout@v4
        with:
          repository: jaspershen-lab/lipidflow
          ref: 7a44a1f341973de2db81af6c9c191bf40e30a13e
          path: vendor/lipidflow
      - run: npm ci
      - run: npm run test:core
      - uses: actions/cache/restore@v4
        id: r-cache
        with:
          path: runtime/windows-library
          key: windows-r-v1-${{ hashFiles('packaging/r-packages.lock.json') }}
      - name: Restore and bundle Windows R (locked to macOS baseline)
        env:
          GITHUB_PAT: ${{ github.token }}
        run: npm run bundle:r:windows
      - uses: actions/cache/save@v4
        if: always() && steps.r-cache.outputs.cache-hit != 'true'
        with:
          path: runtime/windows-library
          key: windows-r-v1-${{ hashFiles('packaging/r-packages.lock.json') }}
      - run: npm run pack:windows
      - name: Install into a path containing spaces and Unicode
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release/windows/*-setup.exe | Select-Object -First 1).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'LipidFlow 安装 Test'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          if (!(Test-Path "$destination/LipidFlow.exe")) { throw 'Installed executable missing' }
          "LIPIDFLOW_EXECUTABLE=$destination/LipidFlow.exe" >> $env:GITHUB_ENV
          "LIPIDFLOW_TEST_RESOURCES=$destination/resources" >> $env:GITHUB_ENV
      - name: Test installed analysis engine and real mzXML input
        run: node tests/installed-engine.cjs
      - name: Test installed desktop, review and downloads
        run: |
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:exploration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release/windows/*-setup.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: lipidflow-windows-x64
          path: |
            release/windows/*-setup.exe
            release/windows/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-evidence
          path: |
            test-output/**/*.log
            test-output/**/log
            test-output/**/*.png
            runtime/R/*manifest.json
          if-no-files-found: ignore
  attach-to-release:
    if: github.event_name == 'release'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lipidflow-windows-x64
          path: artifacts
      - name: Attach tested Windows installer to the same release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/*
